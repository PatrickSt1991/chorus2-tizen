name: Build Chorus2 Tizen

on:
  workflow_dispatch:
  push:
    branches: [tizen]
    paths:
      - 'tizen/**'
      - 'dist/**'
      - '.github/workflows/build-tizen.yml'

permissions:
  contents: write

env:
  TIZEN_STUDIO_VER: '5.5'
  PROFILE_NAME: 'Chorus2'
  CERT_NAME: 'chorus2Cert'
  CERT_PASSWORD: '1234'
  DIST_SIGNER_PASSWORD: 'tizenpkcs12passfordsigner'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout this repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Node.js (for `node -p` in the version-extraction step)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install required apt packages
      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y expect imagemagick

      # 4. Download Tizen Studio
      - name: Download Tizen Studio ${{ env.TIZEN_STUDIO_VER }}
        run: |
          curl -L -o tizen-installer \
            "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"

      # 5. Install Tizen Studio
      - name: Install Tizen Studio
        run: |
          chmod +x tizen-installer
          ./tizen-installer --accept-license "${GITHUB_WORKSPACE}/tizen-studio"
          rm ./tizen-installer

      # 6. Create signing certificate + security profile
      - name: Create Tizen certificate and profile
        run: |
          TIZEN="${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin/tizen"
          "$TIZEN" certificate \
            -a "$PROFILE_NAME" \
            -p "$CERT_PASSWORD" \
            -c US -s NA -ct NA -o Chorus2 \
            -n Chorus2Tizen \
            -e chorus2@example.org \
            -f "$CERT_NAME"
          "$TIZEN" security-profiles add \
            -n "$PROFILE_NAME" \
            -a "${GITHUB_WORKSPACE}/tizen-studio-data/keystore/author/${CERT_NAME}.p12" \
            -p "$CERT_PASSWORD"
          "$TIZEN" cli-config "profiles.path=${GITHUB_WORKSPACE}/tizen-studio-data/profile/profiles.xml"

      # 7. Fetch avplayVideoPlayer.js from PatrickSt1991/tizen-jellyfin-avplay
      #    Overwrites our placeholder. Phase 3 will commit the real version
      #    and this step becomes a no-op safety net. We require a 200 (curl -f
      #    fails on HTTP errors) and a non-trivial response size so a 404 page
      #    can't sneak through and ship as a 14-byte "404: Not Found".
      - name: Fetch avplayVideoPlayer.js
        run: |
          curl -fL --retry 3 \
            -o tizen/extras/avplayVideoPlayer.js \
            https://raw.githubusercontent.com/PatrickSt1991/tizen-jellyfin-avplay/main/extras/avplayVideoPlayer.js
          BYTES=$(wc -c < tizen/extras/avplayVideoPlayer.js)
          echo "fetched $BYTES bytes"
          if [ "$BYTES" -lt 1000 ]; then
            echo "::error::avplayVideoPlayer.js fetch returned only $BYTES bytes — looks like an error page, aborting"
            head -5 tizen/extras/avplayVideoPlayer.js
            exit 1
          fi
          head -5 tizen/extras/avplayVideoPlayer.js

      # 8. Run our build (prepare + tizen build-web only — packaging is
      #    interactive and is done by the expect script in the next step)
      - name: Run build.sh --no-package
        env:
          TIZEN_BIN: ${{ github.workspace }}/tizen-studio/tools/ide/bin/tizen
          TIZEN_PROFILE: ${{ env.PROFILE_NAME }}
        run: bash tizen/build.sh --no-package

      # 9. Inline the cert passwords into profiles.xml so the expect script
      #    only has to confirm them. (The CLI prompts for them otherwise.)
      - name: Prepare profiles.xml for unattended signing
        run: |
          PROFILES_XML="${GITHUB_WORKSPACE}/tizen-studio-data/profile/profiles.xml"
          sed -i "s|${GITHUB_WORKSPACE}/tizen-studio-data/keystore/author/${CERT_NAME}.pwd|${CERT_PASSWORD}|g" "$PROFILES_XML"
          sed -i "s|${GITHUB_WORKSPACE}/tizen-studio-data/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd|${DIST_SIGNER_PASSWORD}|g" "$PROFILES_XML"
          sed -i 's|password=""|password="'"${DIST_SIGNER_PASSWORD}"'"|g' "$PROFILES_XML"

      # 10. expect-driven `tizen package` (it still prompts; expect feeds it)
      - name: Package WGT (expect-driven)
        env:
          TIZEN_BIN: ${{ github.workspace }}/tizen-studio/tools/ide/bin/tizen
          BUILD_DIR: ${{ github.workspace }}/build
        run: |
          cat > package.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 300
          spawn $env(TIZEN_BIN) package -t wgt -s $env(PROFILE_NAME) -- $env(BUILD_DIR)/.buildResult
          expect {
            "Author password:"          { send "$env(CERT_PASSWORD)\r"; exp_continue }
            "Save author password"      { send "n\r"; exp_continue }
            "Distributor1 password:"    { send "$env(DIST_SIGNER_PASSWORD)\r"; exp_continue }
            "Save distributor1 password" { send "n\r"; exp_continue }
            eof
          }
          catch wait result
          set exit_code [lindex $result 3]
          exit $exit_code
          EOF
          chmod +x package.exp
          PROFILE_NAME="$PROFILE_NAME" \
          CERT_PASSWORD="$CERT_PASSWORD" \
          DIST_SIGNER_PASSWORD="$DIST_SIGNER_PASSWORD" \
            ./package.exp

      # 11. Stage the artifact under release/
      - name: Move .wgt to release/
        run: |
          mkdir -p release
          WGT=$(find "${GITHUB_WORKSPACE}/build/.buildResult" -maxdepth 1 -name '*.wgt' -print -quit)
          if [ -z "$WGT" ]; then
            echo "::error::tizen package did not produce a .wgt"
            ls -la "${GITHUB_WORKSPACE}/build/.buildResult" || true
            exit 1
          fi
          mv "$WGT" release/Chorus2-Tizen.wgt
          ls -la release/

      # 12. Always upload the artifact (downloadable from the workflow run page)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chorus2-Tizen-wgt
          path: release/Chorus2-Tizen.wgt
          if-no-files-found: error

      # 13. Compute version + timestamp for the release tag
      - name: Compute release tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +'%Y-%m-%d-%H%M')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date_tag=${DATE}"   >> "$GITHUB_OUTPUT"
          echo "date_pretty=$(date +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      # 14. Publish a Release. Skipped on PRs; the artifact upload above is
      #     sufficient for non-tagged runs.
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/tizen'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'tizen-v${{ steps.tag.outputs.version }}-${{ steps.tag.outputs.date_tag }}'
          name: 'Chorus2 Tizen v${{ steps.tag.outputs.version }} (${{ steps.tag.outputs.date_pretty }})'
          files: |
            release/Chorus2-Tizen.wgt
            tools/debug-server.py
          body: |
            ## Chorus2 for Samsung Tizen TV

            Built ${{ steps.tag.outputs.date_pretty }} from chorus2 ${{ steps.tag.outputs.version }}.

            Wraps the Chorus2 Kodi web interface in a Tizen `.wgt` and routes
            video playback through Tizen AVPlay so files stream and decode on
            the TV itself, not on the Kodi server.

            ### Install

            1. Enable **Developer Mode** on your Samsung TV
               ([instructions](https://developer.samsung.com/smarttv/develop/getting-started/using-sdk/tv-device.html)).
            2. Sideload `Chorus2-Tizen.wgt` (Tizen Studio's Device Manager, or
               `sdb install Chorus2-Tizen.wgt`).
            3. Launch the app. On first run a setup screen asks for your
               Kodi host/port, username and password — it pings Kodi before
               continuing, so wrong credentials fail fast.

            ### Optional: live debug log

            If anything misbehaves, the app can stream `console.log`,
            errors, click events and XHR responses to a dev-machine
            terminal over WebSocket. Two steps:

            1. Grab `debug-server.py` (also attached to this release) and
               run it on a machine the TV can reach:
               ```
               python3 debug-server.py
               ```
               Stdlib-only — no `pip install` needed. Default port 9999.
               If Windows Firewall pops up, allow the connection on
               Private networks.
            2. On the TV's first-launch setup screen, fill in the
               **Debug host** field as `<your-pc-ip>:9999`, e.g.
               `192.168.1.20:9999`. Press Connect.

            Everything the app does will scroll past in the terminal,
            colour-coded by event type. Leave the Debug host field blank
            to keep things quiet.

            ### Build details
            - chorus2 base: ${{ steps.tag.outputs.version }}
            - Branch: tizen
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
